# litellm/proxy/tinyproxy.conf
# No User/Group directives: the image runs as numeric non-root UID/GID 10001
# (Dockerfile `USER 10001`), so tinyproxy never starts as root and must not
# attempt a privilege drop.
Port 8888
Listen 0.0.0.0
Timeout 600

# Default-deny allowlist; only hosts in the filter file pass.
Filter "/etc/tinyproxy/allowlist.filter"
FilterDefaultDeny Yes
# Extended POSIX regex (replaces deprecated FilterExtended) so the allowlist can
# use alternation and grouping for host matching.
FilterType ere
FilterCaseSensitive Off

# HTTPS via CONNECT to 443 only -> proxy never terminates TLS, never sees token bytes.
ConnectPort 443

# Restrict who may use the proxy to private container subnets (defense in depth;
# the internal network already isolates it).
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Minimize information leakage.
DisableViaHeader Yes
LogLevel Warning
PidFile "/tmp/tinyproxy.pid"
LogFile "/dev/stdout"
